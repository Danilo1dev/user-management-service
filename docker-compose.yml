services:
  DB-user-management:
    image: postgres:15-alpine
    container_name: DB-user-management
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-management-service:
    build: ./
    container_name: user-management-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      DB-user-management:
        condition: service_healthy
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge